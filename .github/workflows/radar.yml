
name: BASCKA RADAR B3

on:
  schedule:
    # UTC: 13h a 19h
    # Brasilia: 10h a 16h
    - cron: "*/10 13-19 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bascka-radar-b3
  cancel-in-progress: false

jobs:

  executar-radar:

    runs-on: ubuntu-latest

    timeout-minutes: 9

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar BASCKA RADAR
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar_b3.py

      - name: Atualizar resultados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Atualizacao BASCKA RADAR B3"
            git push
          fi
